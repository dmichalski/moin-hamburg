name: Validate

on:
  push:
    branches-ignore: ["dependabot/**"]   # checked through their pull request
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# hassfest and the HACS action follow their branches on purpose: they check against what Home Assistant and the
# Marketplace expect today. They run with a read-only token and no secrets.
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # No ignores: the default list of the Marketplace wants every check green. The brands check finds the
          # icon in custom_components/moin_hamburg/brand.
