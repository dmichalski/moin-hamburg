name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Renderer and state, plain Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python3 tests/test_golden.py
      - run: python3 tests/test_state.py
      - run: python3 tests/test_showcase.py

  homeassistant:
    name: Integration in Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest
